---
services:
  db:
    image: ysv26/dbimage:db
    deploy:
      replicas: 2
    ports:
      - "3306:3306"
    networks:
      - mynetwork1

  auth_service:
    image: ysv26/authimage:auth
    deploy:
      replicas: 2
    ports:
      - "1011:5001"
    networks:
      - mynetwork1
    depends_on:
      - db
    

  book_service:
    image: ysv26/bookimage:book
    deploy:
      replicas: 2
    ports:
      - "1012:5002"
    networks:
      - mynetwork1
    depends_on:
      - db
  borrow_service:
    image: ysv26/borrowimage:borrow
    deploy:
      replicas: 2
    ports:
      - "1013:5003"
    networks:
      - mynetwork1
    depends_on:
      - db

  frontend:
    image: ysv26/appimage:app
    deploy:
      replicas: 2
    ports:
      - "1014:5000"
    networks:
      - mynetwork1
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
