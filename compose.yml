---
services:
  db:
    image: ysv26/db-image:db
    deploy:
      replicas: 2
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: ysv26/authentication:auth
    deploy:
      replicas: 2
    ports:
      - "1011:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: ysv26/book:book
    deploy:
      replicas: 2
    ports:
      - "1012:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: ysv26/borrow:borrow
    deploy:
      replicas: 2
    ports:
      - "1013:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: ysv26/frontend:frontend
    deploy:
      replicas: 2
    ports:
      - "1014:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
